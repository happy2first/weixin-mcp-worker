name: One-shot v0.4 type compatibility fix

on:
  push:
    paths:
      - '.github/workflows/one-shot-v04-type-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact type fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          types = Path('src/types.ts')
          s = types.read_text()
          old = 'import type { DurableObjectNamespace } from "@cloudflare/workers-types";'
          new = 'import type { DurableObjectNamespace } from "cloudflare:workers";'
          if old not in s:
              raise SystemExit('expected DurableObjectNamespace import not found')
          types.write_text(s.replace(old, new, 1))

          bot = Path('src/weixin-bot.ts')
          s = bot.read_text()
          old = 'type MediaChunkRow = { data: unknown };'
          new = 'type MediaChunkRow = { data: ArrayBuffer };'
          if old not in s:
              raise SystemExit('expected MediaChunkRow declaration not found')
          bot.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types.ts src/weixin-bot.ts
          git commit -m 'Fix v0.4 Cloudflare type compatibility'
          git push
