name: One-shot v0.5 retention diagnostic

on:
  push:
    paths:
      - '.github/workflows/one-shot-v05-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reproduce patch and check
        shell: bash
        run: |
          set +e
          LOG=.v05-diagnostic.log
          : > "$LOG"
          python - <<'PY' >> "$LOG" 2>&1
          from pathlib import Path
          wf = Path('.github/workflows/one-shot-v05-retention.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Validate"
          start = wf.find(start_marker)
          end = wf.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit('could not extract patch script from retention workflow')
          script = wf[start + len(start_marker):end]
          lines = script.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          print('=== PATCH ===')
          exec(compile(script, '<retention-patch>', 'exec'))
          print('PATCH_OK')
          PY
          PATCH_RC=$?
          echo "PATCH_RC=$PATCH_RC" >> "$LOG"
          if [ "$PATCH_RC" -eq 0 ]; then
            echo "=== NPM INSTALL ===" >> "$LOG"
            npm install >> "$LOG" 2>&1
            NPM_RC=$?
            echo "NPM_RC=$NPM_RC" >> "$LOG"
            if [ "$NPM_RC" -eq 0 ]; then
              echo "=== NPM RUN CHECK ===" >> "$LOG"
              npm run check >> "$LOG" 2>&1
              CHECK_RC=$?
              echo "CHECK_RC=$CHECK_RC" >> "$LOG"
            fi
          fi
          git reset --hard HEAD
          git clean -fd -e "$LOG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$LOG"
          git commit -m 'Record v0.5 retention diagnostic'
          git push
