name: Upgrade v0.5.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v051-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and validate upgrade
        id: upgrade
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '=== apply source upgrade ==='
            node scripts/upgrade-v051.mjs
            echo '=== generate lockfile ==='
            npm install --package-lock-only --ignore-scripts
            echo '=== clean install ==='
            npm ci
            echo '=== audit ==='
            npm audit --omit=dev --audit-level=high
            echo '=== tests ==='
            npm test
            echo '=== typecheck + wrangler dry-run ==='
            npm run check
          } 2>&1 | tee /tmp/v051-upgrade.log
      - name: Commit diagnostics on failure
        if: steps.upgrade.outcome == 'failure'
        run: |
          cp /tmp/v051-upgrade.log v051-upgrade.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v051-upgrade.log
          git commit -m "Record v0.5.1 upgrade diagnostics"
          git push
      - name: Commit validated upgrade
        if: steps.upgrade.outcome == 'success'
        run: |
          rm -f scripts/upgrade-v051.mjs .github/workflows/v051-upgrade.yml v051-upgrade.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden v0.5.1 for production deployment"
          git push
      - name: Fail workflow when validation failed
        if: steps.upgrade.outcome == 'failure'
        run: exit 1
