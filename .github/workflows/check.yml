name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-review-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final delivery-history consistency fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/bot.ts')
          s=p.read_text()
          insert_at=s.index('  private async send(text: string) {')
          helper='''  private async persistDeliveredHistory(row: MessageRow): Promise<string | null> {\n    try {\n      this.insertHistory(row);\n      return null;\n    } catch (firstError) {\n      if (isStorageFullError(firstError)) {\n        await this.safeEnforceRetention();\n        try {\n          this.insertHistory(row);\n          return null;\n        } catch (retryError) {\n          await this.alertStorageFull(retryError);\n          return errorMessage(retryError);\n        }\n      }\n      return errorMessage(firstError);\n    }\n  }\n\n'''
          if 'private async persistDeliveredHistory' not in s:
              s=s[:insert_at]+helper+s[insert_at:]
          start=s.index('  private async send(text: string) {')
          end=s.index('  private async sendMedia(',start)
          send='''  private async send(text: string) {\n    const account = await this.account();\n    if (!account?.token || !account.userId) throw new Error("尚未绑定微信 ClawBot，请先在 /admin 完成扫码绑定");\n    const chunks = splitText(text);\n    if (!chunks.length) throw new Error("消息内容不能为空");\n    if (chunks.length > MAX_SEND_CHUNKS) throw new Error("消息过长；单次最多发送约 7 万字符");\n    const ref = `out_${crypto.randomUUID().replace(/-/g, "")}`;\n    const messageIds: string[] = [];\n    let contextToken = account.contextToken;\n    let recovery: string = "none";\n    await this.safeEnforceRetention();\n    try {\n      for (let i = 0; i < chunks.length; i += 1) {\n        const sent = await this.sendTextWithRecovery(account, account.userId, chunks[i], contextToken);\n        messageIds.push(sent.value);\n        contextToken = sent.contextToken;\n        if (sent.recovery !== "none") recovery = sent.recovery;\n        if (i < chunks.length - 1) await sleep(SEND_CHUNK_DELAY_MS);\n      }\n    } catch (error) {\n      try { this.insertHistory({ message_ref:ref,source_id:null,direction:"outbound",kind:"text",text,status:"failed",context_token:null,from_user_id:null,created_at:new Date().toISOString(),replied_at:null,reply_to:null,metadata_json:JSON.stringify({ chunks:chunks.length,recovery }),external_ids_json:JSON.stringify(messageIds),error:errorMessage(error) }); } catch (historyError) { await this.alertStorageFull(historyError); }\n      await this.safeEnforceRetention();\n      throw error;\n    }\n    const historyWarning = await this.persistDeliveredHistory({ message_ref:ref,source_id:null,direction:"outbound",kind:"text",text,status:"sent",context_token:null,from_user_id:null,created_at:new Date().toISOString(),replied_at:null,reply_to:null,metadata_json:JSON.stringify({ chunks: chunks.length, recovery }),external_ids_json:JSON.stringify(messageIds),error:null });\n    const cleanup = await this.safeEnforceRetention();\n    return { success:true,messageRef:ref,recipient:maskId(account.userId),chunks:chunks.length,messageIds,recovery,historyWarning,cleanup };\n  }\n\n'''
          s=s[:start]+send+s[end:]
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run check
      - name: Commit validated source fix
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bot.ts
          git diff --cached --quiet || git commit -m "Preserve send success when history persistence fails"
          git push origin HEAD:final-review-fix
