name: Check

on:
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin-runtime-fix-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace dynamic inline handlers with event delegation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/admin-page.ts')
          s=p.read_text()
          start=s.index('function renderUsers(){'); end=s.index('function renderRetention(){',start)
          s=s[:start]+'''function renderUsers(){var el=document.getElementById('users');if(!state.users.length){el.innerHTML='<div class="card empty">还没有微信用户。<br><button class="btn primary" onclick="openAdd()">添加第一个用户</button></div>';return}el.innerHTML=state.users.map(function(u){var s=u.status||{},used=Number(s.historyBytes||0),limit=Number(s.historyLimitBytes||734003200),pct=limit?Math.min(100,used/limit*100):0,id=esc(u.id);return'<article class="userCard"><div class="userHead"><div><div class="userName">'+esc(u.name)+'</div><div class="muted">'+id+'</div></div><div><span class="tag '+(s.connected?'ok':'warn')+'">'+(s.connected?'已绑定':'未绑定')+'</span>'+(u.isDefault?' <span class="tag blue">默认</span>':'')+'</div></div><div class="detail"><div><div class="muted">消息</div>'+Number(s.messageCount||0)+' 条</div><div><div class="muted">待处理</div>'+Number(s.pendingInbound||0)+' 条</div><div><div class="muted">历史数据</div>'+fmtBytes(used)+' / '+fmtBytes(limit)+'</div><div><div class="muted">媒体</div>'+fmtBytes(s.mediaBytes||0)+'</div></div><div class="progress"><div class="bar" style="width:'+pct.toFixed(1)+'%"></div></div><div class="actions"><button class="btn small primary" data-action="bind" data-id="'+id+'">'+(s.connected?'重新绑定':'扫码绑定')+'</button><button class="btn small" data-action="send-text" data-id="'+id+'">发文本</button><button class="btn small" data-action="send-media" data-id="'+id+'">发媒体</button><button class="btn small" data-action="poll" data-id="'+id+'">拉取回复</button></div><div class="actions"><button class="btn small" data-action="rename" data-id="'+id+'">改名</button><button class="btn small" data-action="toggle" data-id="'+id+'" data-enabled="'+(!u.enabled)+'">'+(u.enabled?'停用':'启用')+'</button>'+(!u.isDefault?'<button class="btn small" data-action="make-default" data-id="'+id+'">设默认</button>':'')+'<button class="btn small" data-action="clear-messages" data-id="'+id+'">清空消息</button><button class="btn small danger" data-action="delete-user" data-id="'+id+'">删除</button></div>'+(s.lastPollError?'<div class="notice warnBox" style="margin-top:10px">最近轮询错误：'+esc(s.lastPollError)+'</div>':'')+'</article>'}).join('')}
'''+s[end:]
          start=s.index('function renderRetention(){'); end=s.index('async function saveRetention(',start)
          s=s[:start]+'''function renderRetention(){var el=document.getElementById('retention');if(!state.users.length){el.innerHTML='<div class="empty">添加用户后可配置。</div>';return}el.innerHTML=state.users.map(function(u){var s=u.status||{},limit=Math.round(Number(s.historyLimitBytes||734003200)/1048576),used=Number(s.historyBytes||0),pct=s.historyLimitBytes?Math.min(100,used/Number(s.historyLimitBytes)*100):0,id=esc(u.id);return'<div class="setting"><div style="flex:1"><strong>'+esc(u.name)+' <span class="muted">('+id+')</span></strong><div class="muted">已保留 '+fmtBytes(used)+' · SQLite '+fmtBytes(s.databaseBytes||0)+(s.retentionLastCleanupAt?' · 最近清理 '+esc(fmtTime(s.retentionLastCleanupAt)):'')+'</div><div class="progress"><div class="bar" style="width:'+pct.toFixed(1)+'%"></div></div></div><div><input id="limit-'+id+'" class="input" type="number" min="50" max="700" step="50" value="'+limit+'" style="width:110px"><button class="btn primary" data-action="retention-save" data-id="'+id+'">保存</button></div></div>'}).join('')}
'''+s[end:]
          start=s.index('function renderMessages(){'); end=s.index('async function deleteMessage(',start)
          s=s[:start]+'''function renderMessages(){var uid=document.getElementById('filterUser').value,kind=document.getElementById('filterKind').value,q=document.getElementById('search').value.trim().toLowerCase(),rows=state.messages.filter(function(m){if(uid&&(!m.user||m.user.id!==uid))return false;if(kind&&m.kind!==kind)return false;if(q&&String(m.text||'').toLowerCase().indexOf(q)<0&&JSON.stringify(m.metadata||{}).toLowerCase().indexOf(q)<0)return false;return true});document.getElementById('messages').innerHTML=rows.length?rows.map(function(m){return'<article class="msg"><div class="msgHead"><div class="msgMeta"><span class="tag blue">'+esc((m.user||{}).name||'')+'</span><span class="tag">'+(m.direction==='inbound'?'微信 → ChatGPT':'ChatGPT → 微信')+'</span><span class="tag">'+esc(labelKind(m.kind))+'</span><span class="tag '+(m.status==='failed'?'danger':m.status==='pending'?'warn':'ok')+'">'+esc(m.status)+'</span><span class="muted">'+esc(fmtTime(m.createdAt))+'</span></div><button class="btn small danger" data-action="message-delete" data-ref="'+esc(m.messageRef)+'">删除</button></div><div class="msgText">'+esc(m.text||'')+'</div>'+mediaHtml(m)+'</article>'}).join(''):'<div class="empty">暂无匹配消息</div>'}
'''+s[end:]
          marker='async function refreshAll(){await loadUsers();await loadMessages()};refreshAll();'
          delegation='''document.addEventListener('click',function(event){var target=event.target;if(!target||typeof target.closest!=='function')return;var button=target.closest('[data-action]');if(!button)return;var action=button.getAttribute('data-action')||'',id=button.getAttribute('data-id')||'';if(action==='bind')return startBind(id);if(action==='send-text')return testSend(id);if(action==='send-media')return openMedia(id);if(action==='poll')return testPoll(id);if(action==='rename')return renameUser(id);if(action==='toggle')return toggleUser(id,button.getAttribute('data-enabled')==='true');if(action==='make-default')return makeDefault(id);if(action==='clear-messages')return clearMessages(id);if(action==='delete-user')return deleteUser(id);if(action==='retention-save')return saveRetention(id);if(action==='message-delete')return deleteMessage(button.getAttribute('data-ref')||'')});
'''
          if marker not in s: raise SystemExit('refresh marker not found')
          if "target.closest('[data-action]')" not in s: s=s.replace(marker,delegation+marker)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run check
      - name: Commit validated candidate and cleanup branch workflows
        run: |
          cat > .github/workflows/check.yml <<'YAML'
          name: Check

          on:
            push:
              branches: [main]
            pull_request:

          permissions:
            contents: read

          jobs:
            check:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: npm ci
                - run: npm audit --omit=dev --audit-level=high
                - run: npm test
                - run: npm run check
          YAML
          rm -f .github/workflows/one-shot-admin-runtime-fix.yml .github/workflows/one-shot-admin-branch-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin-page.ts tests/admin-script.test.ts .github/workflows/check.yml
          git add -u .github/workflows
          git diff --cached --quiet || git commit -m "Fix admin browser script runtime"
          git push origin HEAD:admin-runtime-fix-v2
