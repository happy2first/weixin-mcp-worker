name: One-shot v0.4 response type fix

on:
  push:
    paths:
      - '.github/workflows/one-shot-v04-response-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact response type fix
        run: |
          python - <<'PY'
          from pathlib import Path

          types = Path('src/types.ts')
          s = types.read_text()
          old = 'import type { DurableObjectNamespace } from "cloudflare:workers";'
          new = 'import type { DurableObjectNamespace } from "@cloudflare/workers-types";'
          if old not in s:
              raise SystemExit('expected cloudflare:workers DurableObjectNamespace import not found')
          types.write_text(s.replace(old, new, 1))

          index = Path('src/index.ts')
          s = index.read_text()
          old = '''async function callUserRaw(env: Env, userId: string, path: string, init?: RequestInit): Promise<Response> {\n  return userStub(env, userId).fetch(`https://weixin-bot.internal${path}`, init as any);\n}'''
          new = '''async function callUserRaw(env: Env, userId: string, path: string, init?: RequestInit): Promise<Response> {\n  const upstream = await userStub(env, userId).fetch(`https://weixin-bot.internal${path}`, init as any);\n  const headers = new Headers();\n  upstream.headers.forEach((value, key) => headers.set(key, value));\n  const body = await upstream.arrayBuffer();\n  return new Response(body, {\n    status: upstream.status,\n    statusText: upstream.statusText,\n    headers,\n  });\n}'''
          if old not in s:
              raise SystemExit('expected callUserRaw implementation not found')
          index.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types.ts src/index.ts
          git commit -m 'Fix Durable Object raw response adaptation'
          git push
